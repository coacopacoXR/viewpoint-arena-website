# GitHub Pages, via actions/deploy-pages.
#
# The site is fully static, so the whole job is: install, build, upload dist.
# `SITE_BASE` is the sub-path a project site is served from; a CNAME file in the
# repo root means a custom domain at `/`, so the base is only set when there is
# no CNAME. Nothing here needs the sibling app checkout — `prebuild` runs
# scripts/sync-changelog.mjs, which is a no-op when the app repo is absent and
# the committed src/content/CHANGELOG.md is what gets built.

name: Deploy to GitHub Pages

on:
  push:
    branches: [site/astro]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Resolve the base path
        id: base
        shell: bash
        run: |
          if [ -f CNAME ]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/viewpoint-arena-website/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: npm run build
        env:
          SITE_BASE: ${{ steps.base.outputs.value }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
